<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>État Civil &amp; Démarches — Saint-Cyr-sur-Morin</title>
  <meta name="description" content="Effectuez vos démarches administratives à Saint-Cyr-sur-Morin : demande de carte d'identité, passeport, recensement militaire, listes électorales, mariage, PACS et procuration." />
  <meta name="author" content="Gabriel PAYET" />

  <!-- Pour les sites de communes, préciser la localisation aide Google Maps -->
  <meta name="geo.region" content="FR-77" />
  <meta name="geo.placename" content="Saint-Cyr-sur-Morin" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="État Civil &amp; Démarches — Saint-Cyr-sur-Morin" />
  <meta property="og:description" content="Toutes les informations sur vos démarches administratives : papiers d'identité, recensement, élections, mariage et PACS." />
  <meta property="og:image" content="https://mairie-saint-cyr-sur-morin.vercel.app/assets/img/logoSaintCyr_2020_web.png" />
  <meta property="og:image:width" content="984" />
  <meta property="og:image:height" content="1200" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/logoSaintCyr_2020-favicon.png">

  <!-- Empêche les navigateurs de deviner les types de fichiers (sécurité) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Indique aux moteurs de recherche d'indexer le site -->
  <meta name="robots" content="index, follow" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/sivu.css" />

  <style>
    /* ── BLOCS DÉMARCHE ──────────────────────── */

    .demarche-bloc {
      scroll-margin-top: 2rem;
      margin-bottom: 3rem;
      padding-bottom: 3rem;
      border-bottom: 1px solid rgba(200,191,176,0.25);
    }

    .demarche-bloc:last-of-type {
      border-bottom: none;
      margin-bottom: 0;
    }

    .demarche-bloc-head {
      display: flex; /* Active le mode flexbox */
      align-items: center; /* ALIGNE TOUT VERTICALEMENT AU CENTRE */
      gap: 1.25rem; /* Gère l'espacement entre l'icône et le texte */
      margin-bottom: 1.75rem;
    }

    .demarche-icon {
      display: flex; /* Pour que le SVG reste bien centré dans sa boîte */
      align-items: center;
      justify-content: center;
      width: 44px; /* Ajuste selon ton besoin */
      height: 44px;
      background: var(--vert-pale); /* Si tu as une couleur de fond */
      border-radius: 12px;
      flex-shrink: 0; /* Empêche l'icône de s'écraser */
    }

    /* On supprime les marges par défaut du titre pour ne pas fausser l'alignement */
    .demarche-bloc-head h2 {
      margin: 0;
      line-height: 1.2;
    }

    .demarche-icon svg { stroke: var(--vert); }

    .demarche-bloc-head h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--texte);
      line-height: 1.25;
      margin-bottom: 0.25rem;
    }

    .demarche-bloc-head .update-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--gris);
    }

    /* Layout 2 colonnes pour les blocs qui ont pièces + contenu */
    .demarche-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2.5rem;
      align-items: start;
    }

    .demarche-body p {
      font-size: 0.93rem;
      line-height: 1.85;
      color: var(--texte);
      margin-bottom: 1rem;
    }

    .demarche-body p:last-child { margin-bottom: 0; }

    /* Alerte / délai important */
    .demarche-alert {
      background: rgba(196, 80, 60, 0.07);
      border-left: 3px solid #C4503C;
      border-radius: 0 10px 10px 0;
      padding: 0.9rem 1.25rem;
      margin: 1.25rem 0;
      font-size: 0.85rem;
      color: var(--texte);
      line-height: 1.65;
    }

    .demarche-alert strong { color: #C4503C; }

    /* Lien service-public */
    .sp-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.83rem;
      font-weight: 600;
      color: var(--vert);
      text-decoration: none;
      border: 1.5px solid var(--vert);
      border-radius: 8px;
      padding: 0.5rem 0.9rem;
      margin-top: 0.75rem;
      transition: all 0.2s;
    }

    .sp-link:hover {
      background: var(--vert);
      color: var(--blanc);
    }

    .sp-link svg { stroke: currentColor; }

    /* Encart pièces à fournir */
    .pieces-card {
      background: var(--creme);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 14px;
      padding: 1.4rem;
    }

    .pieces-card h4 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      font-weight: 700;
      color: var(--vert);
      margin-bottom: 1rem;
    }

    .pieces-card ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .pieces-card li {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-size: 0.83rem;
      color: var(--texte);
      line-height: 1.5;
    }

    .pieces-card li::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--vert);
      flex-shrink: 0;
      margin-top: 0.45em;
    }

    /* Encart mairies biométriques */
    .mairies-biometrie {
      background: var(--vert-pale);
      border-radius: 10px;
      padding: 0.9rem 1.1rem;
      margin-top: 1rem;
      font-size: 0.82rem;
      color: var(--texte);
      line-height: 1.7;
    }

    .mairies-biometrie strong {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--vert);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    /* Docs PACS */
    .docs-pacs {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1.25rem;
    }

    .doc-pacs-link {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 10px;
      text-decoration: none;
      color: var(--texte);
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }

    .doc-pacs-link svg { stroke: var(--vert); flex-shrink: 0; }

    .doc-pacs-link:hover {
      border-color: var(--vert);
      color: var(--vert);
      background: var(--vert-pale);
    }


    /* ── RESPONSIVE ──────────────────────────── */

    @media (max-width: 860px) {
      .demarche-layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .demarches-nav {
        gap: 0.4rem;
      }
      .demarche-anchor {
        font-size: 0.78rem;
        padding: 0.45rem 0.8rem;
      }
    }
  </style>
</head>
<body>

<header class="page-header" style="background: var(--vert);">
  <div class="page-header-inner">
    <h1>État civil</h1>
    <p class="page-intro">Vos démarches administratives à la mairie de Saint-Cyr-sur-Morin.</p>
    <div class="update-badge">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      <span id="etat-civil-update-date">...</span>
    </div>
  </div>
</header>

<section class="section">
  <div class="section-inner" id="etat-civil-container">
    </div>
</section>

<div id="footer-placeholder"></div>

<script src="/components/navbar.js"></script>
<script src="/js/scroll-reveal.js"></script>
<script src="/js/site-content-loader.js" type="module"></script>
<script>
  fetch('/components/footer.html')
    .then(r => r.text())
    .then(d => { document.getElementById('footer-placeholder').innerHTML = d; });
</script>
</body>
</html>
