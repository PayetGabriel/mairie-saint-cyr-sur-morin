<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des déchets — Saint-Cyr-sur-Morin</title>
  <meta name="description" content="Collecte et tri des déchets à Saint-Cyr-sur-Morin. Calendrier de collecte, fiches pratiques Covaltri, SMITOM." />
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/sivu.css" />

  <style>

    /* ── FICHES DÉCHET ───────────────────────── */

    .fiches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.25rem;
    }

    .fiche-card {
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: var(--texte);
      transition: all 0.25s;
      display: flex;
      flex-direction: column;
    }

    .fiche-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(42,37,32,0.09);
      border-color: rgba(58,90,64,0.25);
    }

    .fiche-preview {
        width: 100%;
        aspect-ratio: 3/2;
        object-fit: cover;
        object-position: top;
        display: block;
        background: var(--creme);
        
        /* Force un rendu plus net */
        image-rendering: -webkit-optimize-contrast; /* Pour Chrome/Safari */
        image-rendering: high-quality;
    }

    .fiche-preview-absent {
      width: 100%;
      aspect-ratio: 3/2;
      background: var(--creme);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fiche-preview-absent svg { stroke: var(--pierre-dark); opacity: 0.35; }

    .fiche-card img {
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0); /* Force l'accélération matérielle en restant net */
    }

    .fiche-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }

    .fiche-color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .fiche-header {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .fiche-name {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--texte);
    }

    .fiche-desc {
      font-size: 0.82rem;
      color: var(--gris);
      line-height: 1.6;
    }

    .fiche-dl {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--vert);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: auto;
      padding-top: 0.5rem;
    }

    .fiche-dl svg { stroke: var(--vert); }

    /* Couleurs par type de déchet */
    .dot-gris   { background: #888; }
    .dot-jaune  { background: #e8b84b; }
    .dot-vert   { background: var(--vert); }
    .dot-marron { background: #8B5E3C; }


    /* ── CALENDRIER ──────────────────────────── */

    .calendrier-card {
        background: var(--blanc);
        border: 1px solid rgba(200,191,176,0.4);
        border-radius: 20px;
        overflow: hidden;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0;
    }

    .calendrier-preview-col {
        border-right: 1px solid rgba(200,191,176,0.35);
        background: var(--creme); /* Fond de secours pendant le chargement */
    }

    .calendrier-preview-col img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
        display: block;

        /* Amélioration de la netteté pour les images HD redimensionnées */
        image-rendering: -webkit-optimize-contrast;
        image-rendering: high-quality;
        
        /* Stabilité du rendu lors du scroll */
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        transform: translateZ(0);
    }

    .calendrier-info-col {
        padding: 2.5rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1.25rem;
    }

    .calendrier-info-col h3 {
        font-family: 'Playfair Display', serif;
        font-size: 1.3rem;
        font-weight: 600;
        color: var(--texte);
    }

    .calendrier-info-col p {
        font-size: 0.88rem;
        color: var(--gris);
        line-height: 1.7;
    }


    /* ── ORGANISMES ──────────────────────────── */

    .organismes-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }

    .organisme-card {
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 16px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .organisme-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--texte);
    }

    .organisme-card p {
      font-size: 0.88rem;
      color: var(--gris);
      line-height: 1.7;
      margin: 0;
    }

    .organisme-card a {
      color: var(--vert);
      font-weight: 500;
      text-decoration: none;
    }

    .organisme-card a:hover { text-decoration: underline; }


    /* ── RESPONSIVE ──────────────────────────── */

    @media (max-width: 768px) {
      .calendrier-card { grid-template-columns: 1fr; }
      .calendrier-preview-col { border-right: none; border-bottom: 1px solid rgba(200,191,176,0.35); max-height: 200px; overflow: hidden; }
      .organismes-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .fiches-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header class="page-header" style="background: var(--vert);">
  <div class="page-header-inner">
    <h1>Gestion des déchets</h1>
    <p class="page-intro">Collecte, tri et valorisation des déchets sur la commune de Saint-Cyr-sur-Morin.</p>
  </div>
</header>

<section class="section">
  <div class="section-inner">

    <!-- Calendrier de collecte -->
    <div class="reveal">
      <div class="section-label" style="margin-bottom: 0.75rem;">Collecte</div>
      <h2 class="section-title" style="margin-bottom: 2rem;">Calendrier de collecte 2026</h2>
    </div>

    <!-- Zone d'injection du calendrier -->
    <div id="calendrier-target"></div>

    <!-- Fiches pratiques -->
    <div class="reveal">
      <div class="section-label" style="margin-bottom: 0.75rem;">Tri sélectif</div>
      <h2 class="section-title" style="margin-bottom: 0.5rem;">Que mettre dans quel bac ?</h2>
      <p style="font-size: 0.88rem; color: var(--gris); margin-bottom: 2rem;">Fiches pratiques Covaltri — cliquez pour télécharger.</p>
    </div>

    <!-- Zone d'injection de la grille de fiches triées -->
    <div id="fiches-target" class="fiches-grid" style="margin-bottom: 3rem;"></div>

    <!-- Organismes -->
    <div class="reveal">
      <div class="section-label" style="margin-bottom: 0.75rem;">Organismes</div>
      <h2 class="section-title" style="margin-bottom: 2rem;">Qui gère vos déchets ?</h2>
    </div>

    <!-- Zone d'injection des organismes -->
    <div id="organismes-target" class="organismes-grid reveal"></div>

  </div>
</section>

<div id="footer-placeholder"></div>

<script src="/components/navbar.js"></script>
<script src="/js/scroll-reveal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/js/pdf-preview.js"></script>
<script src="/js/site-content-loader.js" type="module"></script>
<script>
  fetch('/components/footer.html')
    .then(r => r.text())
    .then(d => { document.getElementById('footer-placeholder').innerHTML = d; });
</script>
</body>
</html>
