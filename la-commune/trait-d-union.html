<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Pour les sites de communes, préciser la localisation aide Google Maps -->
  <meta name="geo.region" content="FR-77" />
  <meta name="geo.placename" content="Saint-Cyr-sur-Morin" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Le Trait d'Union (Bulletin Municipal) — Saint-Cyr-sur-Morin" />
  <meta property="og:description" content="Le bulletin d'information municipal : toute la vie et l'actualité de Saint-Cyr-sur-Morin à portée de main." />
  <meta property="og:image" content="https://mairie-saint-cyr-sur-morin.vercel.app/assets/img/logoSaintCyr_2020_web.png" />
  <meta property="og:image:width" content="984" />
  <meta property="og:image:height" content="1200" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/logoSaintCyr_2020-favicon.png">

  <!-- Empêche les navigateurs de deviner les types de fichiers (sécurité) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Indique aux moteurs de recherche d'indexer le site -->
  <meta name="robots" content="index, follow" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/sivu.css" />

  <style>

    /* ── NUMÉRO À LA UNE ─────────────────────── */

    .tu-une {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 0;
      background: var(--vert-pale);
      border: 1px solid rgba(58,90,64,0.15);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 3rem;
    }

    .tu-une-cover {
      background: var(--creme);
      overflow: hidden;
    }

    .tu-une-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
    }

    .tu-une-body {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .tu-une-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 700;
      color: var(--vert);
    }

    .tu-une-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--texte);
      line-height: 1.2;
    }

    .tu-une-date {
      font-size: 0.88rem;
      color: var(--gris);
    }

    .tu-une-body .btn {
      align-self: flex-start;
      margin-top: 0.5rem;
    }


    /* ── ACCORDÉONS ARCHIVES (DÉPLIABLES) ────── */

    .tu-annee-accordion {
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 16px;
      margin-bottom: 1.25rem;
      overflow: hidden;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .tu-annee-accordion[open] {
      border-color: rgba(58,90,64,0.25);
      box-shadow: 0 4px 20px rgba(42,37,32,0.04);
    }

    .tu-annee-summary {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--texte);
      padding: 1.25rem 1.5rem;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      user-select: none;
      background: var(--blanc);
    }

    .tu-annee-summary::-webkit-details-marker {
      display: none;
    }

    .tu-summary-left {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .tu-annee-summary span.tu-badge {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gris);
      background: var(--vert-pale);
      padding: 0.2rem 0.65rem;
      border-radius: 100px;
    }

    .tu-chevron {
      stroke: var(--vert);
      transition: transform 0.25s ease;
    }

    .tu-annee-accordion[open] .tu-chevron {
      transform: rotate(90deg);
    }

    .tu-annee-content {
      padding: 0 1.5rem 1.5rem 1.5rem;
      border-top: 1px solid rgba(200,191,176,0.2);
      background: var(--blanc);
      padding-top: 1.25rem;
    }

    .tu-annee-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
    }

    /* Carte numéro */
    .tu-card {
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.22s;
      display: flex;
      flex-direction: column;
    }

    .tu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 22px rgba(42,37,32,0.09);
      border-color: rgba(58,90,64,0.25);
    }

    .tu-card-cover {
      aspect-ratio: 3/4;
      background: var(--creme);
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
    }

    .tu-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: transform 0.35s ease;
    }

    .tu-une-cover canvas,
    .tu-card-cover canvas {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top;
      display: block;
      transition: transform 0.35s ease;
    }

    /* Le conteneur du canvas devient le parent de l'animation */
    .tu-card-cover, .tu-une-cover {
      position: relative;
      background: #f4f1ec; /* Ton fond crème de secours */
      overflow: hidden;
    }

    /* L'animation de vague lumineuse (Skeleton) */
    .tu-card-cover::before, .tu-une-cover::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, #f4f1ec 25%, #eae6df 50%, #f4f1ec 75%);
      background-size: 200% 100%;
      animation: loadingSkeleton 1.6s infinite linear;
      z-index: 1;
      transition: opacity 0.4s ease-out;
    }

    /* SÉCURITÉ : Si le parent est marqué loaded OU s'il contient un placeholder, on cache l'effet */
    .tu-card-cover.loaded::before, 
    .tu-une-cover.loaded::before,
    .tu-card-cover:has(.tu-card-placeholder)::before {
      opacity: 0;
      pointer-events: none;
      animation: none; /* Stoppe complètement le calcul de l'animation */
    }

    /* Le canvas est caché au début, puis apparaît en fondu */
    canvas.pdf-preview {
      opacity: 0;
      transition: opacity 0.4s ease-out, transform 0.35s ease;
      z-index: 2;
      position: relative;
    }

    canvas.pdf-preview.ready {
      opacity: 1;
    }

    @keyframes loadingSkeleton {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .tu-card:hover .tu-card-cover canvas {
      transform: scale(1.04);
    }

    .tu-card:hover .tu-card-cover img {
      transform: scale(1.04);
    }

    .tu-card-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--vert-pale);
    }

    .tu-card-placeholder svg { stroke: var(--vert); opacity: 0.3; }

    .tu-card-body {
      padding: 0.85rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.3rem;
    }

    .tu-card-num {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--texte);
      line-height: 1.3;
    }

    .tu-card-date {
      font-size: 0.73rem;
      color: var(--gris);
    }

    .tu-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--vert);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 0.4rem;
    }

    .tu-card-btn svg { stroke: var(--vert); }

    /* Carte spéciale (hors-série, supplément) */
    .tu-card.special .tu-card-placeholder {
      background: rgba(156,111,62,0.1);
    }

    .tu-card.special .tu-card-placeholder svg {
      stroke: var(--bois);
      opacity: 0.4;
    }

    .tu-card.special .tu-card-num { color: var(--bois); }
    .tu-card.special .tu-card-btn { color: var(--bois); }
    .tu-card.special .tu-card-btn svg { stroke: var(--bois); }


    /* ── RESPONSIVE ──────────────────────────── */

    @media (max-width: 768px) {
      .tu-une { grid-template-columns: 1fr; }
      .tu-une-cover { height: 220px; }
    }

    @media (max-width: 480px) {
      .tu-annee-grid { grid-template-columns: 1fr 1fr; }
      .tu-annee-summary { padding: 1rem; font-size: 1.15rem; }
      .tu-annee-content { padding: 0 1rem 1rem 1rem; padding-top: 1rem; }
    }

    /* Rend l'apparition du contenu de l'accordéon fluide à l'ouverture */
    .tu-annee-content {
      animation: fadeReveal 0.4s cubic-bezier(0.215, 0.610, 0.355, 1) forwards;
    }

    @keyframes fadeReveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Sécurité pour le reveal initial de l'accordéon lui-même */
    .reveal {
      opacity: 0;
      transform: translateY(25px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<header class="page-header" style="background: var(--vert);">
  <div class="page-header-inner">
    <h1>Le Trait d'Union</h1>
    <p class="page-intro">Le bulletin municipal de Saint-Cyr-sur-Morin — toute la vie de la commune dans vos mains.</p>
    
    <div class="update-badge" id="tu-update-badge" style="display: none;">
      <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
      </svg>
      <span id="tu-update-date">Chargement...</span>
    </div>
  </div>
</header>

<section class="section">
  <div class="section-inner">

    <div id="tu-featured-container"></div>

    <div class="section-label reveal" style="margin-bottom: 1.5rem;">Archives</div>

    <div id="tu-archives-container"></div>

  </div>
</section>

<div id="footer-placeholder"></div>
<script src="/components/navbar.js"></script>
<script src="/js/scroll-reveal.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/js/pdf-preview.js"></script>
<script src="/js/site-content-loader.js" type="module"></script>
<script>
  fetch('/components/footer.html')
    .then(r => r.text())
    .then(d => { document.getElementById('footer-placeholder').innerHTML = d; });

  // Animation JS pour la rotation fluide du chevron au clic si besoin (géré nativement par le CSS sinon)
  document.querySelectorAll('.tu-annee-accordion').forEach(accordion => {
    accordion.addEventListener('toggle', () => {
      // Optionnel : tu peux ajouter une logique de scroll-reveal ou d'ajustement ici
    });
  });
</script>

</body>
</html>
