<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Actualités &amp; Événements — Saint-Cyr-sur-Morin</title>
  <meta name="description" content="Suivez toute l'actualité de Saint-Cyr-sur-Morin. Retrouvez les dernières annonces de la mairie, les projets en cours et les événements associatifs et locaux." />
  <meta name="author" content="Gabriel PAYET" />

  <!-- Pour les sites de communes, préciser la localisation aide Google Maps -->
  <meta name="geo.region" content="FR-77" />
  <meta name="geo.placename" content="Saint-Cyr-sur-Morin" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Actualités &amp; Événements — Saint-Cyr-sur-Morin" />
  <meta property="og:description" content="Découvrez les dernières informations, alertes et événements marquants de la commune de Saint-Cyr-sur-Morin." />
  <meta property="og:image" content="https://mairie-saint-cyr-sur-morin.vercel.app/assets/img/logoSaintCyr_2020_web.png" />
  <meta property="og:image:width" content="984" />
  <meta property="og:image:height" content="1200" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/logoSaintCyr_2020-favicon.png">

  <!-- Empêche les navigateurs de deviner les types de fichiers (sécurité) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Indique aux moteurs de recherche d'indexer le site -->
  <meta name="robots" content="index, follow" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/sivu.css" />

  <style>

    /* ── FILTRES ─────────────────────────────── */

    .actu-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }

    .actu-filter-btn {
      padding: 0.5rem 1.1rem;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid rgba(200,191,176,0.5);
      background: var(--blanc);
      color: var(--texte);
      transition: all 0.2s;
    }

    .actu-filter-btn:hover,
    .actu-filter-btn.active {
      background: var(--vert);
      color: var(--blanc);
      border-color: var(--vert);
    }


    /* ── ARTICLE À LA UNE ────────────────────── */

    .actu-une {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 0;
      background: var(--vert-pale);
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 3rem;
      text-decoration: none;
      color: var(--texte);
      transition: all 0.25s;
    }

    .actu-une:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 36px rgba(42,37,32,0.1);
    }

    .actu-une-img {
      height: 100%;
      min-height: 300px;
    }

    .actu-une-img-placeholder {
      width: 100%;
      height: 100%;
      min-height: 300px;
      background: var(--vert-pale);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .actu-une-img-placeholder svg { 
      stroke: var(--vert); 
      opacity: 0.3; 
    }

    .actu-une-body {
      padding: 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1rem;
    }

    .actu-une-meta {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }
    
    .actu-tag {
      display: inline-block;
      background: var(--vert);
      color: var(--blanc);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.2rem 0.7rem;
      border-radius: 100px;
    }

    .actu-une-date {
      font-size: 0.78rem;
      color: var(--pierre-dark);
      line-height: normal;
    }

    .actu-une-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
      color: var(--texte);
    }

    .actu-une-text {
      font-size: 0.88rem;
      color: var(--gris);
      line-height: 1.7;
    }

    .actu-une-lire {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--vert);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }

    .actu-une-lire svg { stroke: var(--vert); }


    /* ── GRILLE ARTICLES ─────────────────────── */

    .actu-page-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    .actu-card {
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: var(--texte);
      display: flex;
      flex-direction: column;
      transition: all 0.25s;
    }

    .actu-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(42,37,32,0.08);
      border-color: rgba(58,90,64,0.2);
    }

    .actu-card-img {
      height: 160px;
      background: var(--creme);
      flex-shrink: 0;
      overflow: hidden;
    }

    .actu-card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .actu-card:hover .actu-card-img img {
      transform: scale(1.04);
    }

    .actu-card-img-placeholder {
      width: 100%;
      height: 100%;
      background: var(--vert-pale);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .actu-card-img-placeholder svg { stroke: var(--vert); opacity: 0.3; }

    .actu-card-body {
      padding: 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex: 1;
    }

    .actu-card-meta {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .actu-card-date {
      font-size: 0.73rem;
      color: var(--pierre-dark);
      line-height: normal;
    }

    .actu-card-title {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--texte);
      flex: 1;
    }

    .actu-card-excerpt {
      font-size: 0.82rem;
      color: var(--gris);
      line-height: 1.65;
    }


    /* ── PAGINATION ──────────────────────────── */

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 3rem;
    }

    .page-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid rgba(200,191,176,0.5);
      background: var(--blanc);
      color: var(--texte);
      text-decoration: none;
      transition: all 0.2s;
    }

    .page-btn:hover,
    .page-btn.active {
      background: var(--vert);
      color: var(--blanc);
      border-color: var(--vert);
    }

    .page-btn svg { stroke: currentColor; }


    /* ── RESPONSIVE ──────────────────────────── */

    @media (max-width: 960px) {
      .actu-page-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 768px) {
      .actu-une {
        grid-template-columns: 1fr;
      }
      .actu-une-img { min-height: 200px; height: 200px; }
      .actu-une-img-placeholder { min-height: 200px; height: 200px; }
    }

    @media (max-width: 520px) {
      .actu-page-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header class="page-header" style="background: var(--vert);">
  <div class="page-header-inner">
    <h1>Actualités</h1>
    <p class="page-intro">La vie de la commune au fil des semaines — travaux, événements, conseil municipal et vie locale.</p>
  </div>
</header>

<section class="section">
  <div class="section-inner">

    <div class="actu-filters reveal" id="filters-container">
      <button class="actu-filter-btn active" data-cat="all">Tout</button>
      <button class="actu-filter-btn" data-cat="travaux">Travaux</button>
      <button class="actu-filter-btn" data-cat="conseil">Conseil municipal</button>
      <button class="actu-filter-btn" data-cat="evenement">Événements</button>
      <button class="actu-filter-btn" data-cat="culture">Culture</button>
      <button class="actu-filter-btn" data-cat="prevention">Prévention</button>
      <button class="actu-filter-btn" data-cat="bulletin">Bulletin</button>
    </div>

    <a href="#" class="actu-une reveal" id="actu-une-container" style="display: none;">
      <div class="actu-une-img" id="actu-une-img"></div>
      <div class="actu-une-body">
        <div class="actu-une-meta">
          <span class="actu-tag" id="actu-une-tag">—</span>
          <span class="actu-une-date" id="actu-une-date">—</span>
        </div>
        <div class="actu-une-title" id="actu-une-title">—</div>
        <div class="actu-une-text" id="actu-une-text">—</div>
        <div class="actu-une-lire">
          Lire l'article
          <svg width="13" height="13" fill="none" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </div>
      </div>
    </a>

    <div class="actu-page-grid" id="actu-grid"></div>

    <div class="pagination reveal" id="actu-pagination"></div>

  </div>
</section>

<div id="footer-placeholder"></div>

<script src="/components/navbar.js"></script>
<script src="/js/scroll-reveal.js"></script>
<script type="module" src="/js/actualites.js"></script>
</body>
</html>
