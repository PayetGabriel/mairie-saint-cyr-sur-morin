<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Arrêtés Municipaux — Saint-Cyr-sur-Morin</title>
  <meta name="description" content="Consultez les arrêtés municipaux et préfectoraux en vigueur à Saint-Cyr-sur-Morin. Restez informé des réglementations, de la voirie et de la sécurité dans la commune." />
  <meta name="author" content="Gabriel PAYET" />

  <!-- Pour les sites de communes, préciser la localisation aide Google Maps -->
  <meta name="geo.region" content="FR-77" />
  <meta name="geo.placename" content="Saint-Cyr-sur-Morin" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Arrêtés Municipaux — Saint-Cyr-sur-Morin" />
  <meta property="og:description" content="Retrouvez la liste des décisions réglementaires et arrêtés préfectoraux ou municipaux de votre village." />
  <meta property="og:image" content="https://mairie-saint-cyr-sur-morin.vercel.app/assets/img/logoSaintCyr_2020_web.png" />
  <meta property="og:image:width" content="984" />
  <meta property="og:image:height" content="1200" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/logoSaintCyr_2020-favicon.png">

  <!-- Empêche les navigateurs de deviner les types de fichiers (sécurité) -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <!-- Indique aux moteurs de recherche d'indexer le site -->
  <meta name="robots" content="index, follow" />

  <!-- Fonts & Styles -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/sivu.css" />

  <style>
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      background: var(--creme);
      border: 2px dashed rgba(200,191,176,0.6);
      border-radius: 20px;
    }

    .empty-state > svg { stroke: var(--pierre-dark); opacity: 0.3; margin-bottom: 1.25rem; }

    .empty-state h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--texte);
      margin-bottom: 0.6rem;
    }

    .empty-state p {
      font-size: 0.88rem;
      color: var(--gris);
      max-width: 400px;
      margin: 0 auto 1.5rem;
      line-height: 1.7;
    }

    .btn-outline {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s ease; /* Transition pour le bouton lui-même */
    }

    .btn-outline svg {
      display: block; /* Enlève les espaces résiduels sous le SVG */
      transition: transform 0.2s ease-in-out; /* LA clé pour la fluidité */
      transform: translateY(0.25px);
    }

    .btn-outline:hover svg {
      transform: translateX(3px) translateY(0.25px); /* Seul le chevron bouge au survol */
    }

    /* Arrêté card (à activer quand il y en a) */
    .arrete-card {
      background: var(--blanc);
      border: 1px solid rgba(200,191,176,0.4);
      border-radius: 14px;
      padding: 1.4rem 1.75rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      transition: all 0.22s;
      text-decoration: none;
      color: var(--texte);
    }

    .arrete-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(42,37,32,0.08);
      border-color: rgba(58,90,64,0.2);
    }

    .arrete-num {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--vert);
      flex-shrink: 0;
      min-width: 80px;
    }

    .arrete-info { flex: 1; }

    .arrete-title {
      font-size: 0.93rem;
      font-weight: 600;
      color: var(--texte);
      margin-bottom: 0.2rem;
    }

    .arrete-date {
      font-size: 0.78rem;
      color: var(--gris);
    }

    .arrete-pdf {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--vert);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }

    .arrete-pdf svg { stroke: var(--vert); }

    @media (max-width: 576px) {
      .arrete-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .arrete-pdf {
        align-self: flex-end; /* Aligne le bouton à droite en bas sur mobile */
      }
    }
  </style>
</head>
<body>

<header class="page-header" style="background: var(--vert);">
  <div class="page-header-inner">
    <h1>Arrêtés municipaux</h1>
    <p class="page-intro">Les arrêtés en vigueur pris par le Maire de Saint-Cyr-sur-Morin.</p>
  </div>
</header>

<section class="section">
  <div class="section-inner">

    <div class="section-label reveal" style="margin-bottom: 0.75rem;">En vigueur</div>
    <h2 class="section-title reveal" style="margin-bottom: 2rem;">Arrêtés actuels</h2>

    <div id="arretes-wrapper">
      </div>

  </div>
</section>

<div id="footer-placeholder"></div>
<script src="/components/navbar.js"></script>
<script src="/js/scroll-reveal.js"></script>
<script src="/js/site-content-loader.js" type="module"></script>
<script>
  fetch('/components/footer.html')
    .then(r => r.text())
    .then(d => { document.getElementById('footer-placeholder').innerHTML = d; });
</script>
</body>
</html>
