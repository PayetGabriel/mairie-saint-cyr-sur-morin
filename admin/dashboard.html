<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Tableau de bord — Espace Collaborateur</title>
  <meta name="description" content="Tableau de bord de gestion de la mairie de Saint-Cyr-sur-Morin. Accédez à vos raccourcis et vos droits d'accès." />
  <meta name="author" content="Gabriel PAYET" />

  <!-- Sécurité maximale -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Open Graph (Gabarit conservé) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Tableau de bord — Espace Collaborateur" />
  <meta property="og:description" content="Espace de travail et administration du site de la commune." />
  <meta property="og:image" content="https://mairie-saint-cyr-sur-morin.vercel.app/assets/img/logoSaintCyr_2020_web.png" />
  <meta property="og:image:width" content="984" />
  <meta property="og:image:height" content="1200" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/logoSaintCyr_2020-favicon.png">
  
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body>

  <!-- Loader (affiché pendant la vérification auth) -->
  <div class="page-loader" id="page-loader">
    <div class="spinner"></div>
  </div>

  <div class="admin-layout" id="admin-layout" style="visibility:hidden">

    <!-- Overlay mobile -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Sidebar (injecté par auth-guard.js) -->
    <aside class="sidebar" id="sidebar" role="complementary" aria-label="Navigation"></aside>

    <!-- Contenu -->
    <main class="main-content">

      <!-- Topbar mobile -->
      <div class="mobile-topbar">
        <button class="btn-hamburger" id="btn-hamburger" aria-label="Ouvrir le menu">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/>
          </svg>
        </button>
        <span class="mobile-topbar-title">Administration</span>
      </div>

      <!-- En-tête -->
      <div class="page-header">
        <div class="page-header-left">
          <h1 class="page-title">Tableau de bord</h1>
          <p class="page-subtitle" id="page-date"></p>
        </div>
      </div>

      <div class="page-content">

        <!-- Carte de bienvenue -->
        <div class="welcome-card">
          <div>
            <p class="welcome-greeting" id="welcome-greeting">Bonjour…</p>
            <p class="welcome-sub">Bienvenue dans l'espace d'administration de la mairie.</p>
            <span class="welcome-badge" id="welcome-badge">—</span>
          </div>
        </div>

        <!-- Accès rapides -->
        <p style="font-size:13px;font-weight:600;color:var(--pierre-dark);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">
          Accès rapides
        </p>
        <div id="quick-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:24px">
          <!-- Injecté dynamiquement -->
          <div style="grid-column:1/-1;text-align:center;padding:24px 0">
            <div class="spinner" style="margin:0 auto 8px"></div>
            <p class="text-muted text-sm">Chargement…</p>
          </div>
        </div>

        <!-- Infos -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Informations</span>
          </div>
          <div class="card-body">
            <p style="font-size:13.5px;color:var(--pierre-dark);line-height:1.7">
              Ce panel vous permet de gérer le contenu du site de la commune de Saint-Cyr-sur-Morin.<br>
              En cas de problème technique, contactez l'administrateur.
            </p>
          </div>
        </div>

      </div>
    </main>

  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { supabase }                              from '/admin/js/supabase-config.js'
    import { requireAuth, buildSidebar, PERMISSIONS } from '/admin/js/auth-guard.js'

    async function init() {
      const auth = await requireAuth()
      if (!auth) return

      const { profile } = auth
      const admin = ['admin', 'super_admin'].includes(profile.role)

      /* Afficher la page */
      document.getElementById('page-loader').style.display    = 'none'
      document.getElementById('admin-layout').style.visibility = 'visible'

      /* Sidebar */
      buildSidebar(profile, 'dashboard')

      /* Date */
      document.getElementById('page-date').textContent = new Date().toLocaleDateString('fr-FR', {
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      })

      /* Carte de bienvenue */
      const prenom = profile.prenom?.trim() || profile.email.split('@')[0]
      const nom    = profile.nom?.trim()    || ''
      const fullName = [prenom, nom].filter(Boolean).join(' ')

      document.getElementById('welcome-greeting').textContent = `Bonjour ${fullName}, ravi de vous revoir.`

      const roleLabels = {
        super_admin: 'Super Administrateur',
        admin:       'Administrateur',
        employee:    'Employé',
      }
      document.getElementById('welcome-badge').textContent = roleLabels[profile.role] || profile.role

      /* Accès rapides */
      const items = []

      if (admin || profile.can_manage_publications || profile.can_manage_mediatheque) {
        items.push({ 
          icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5h1.5m-1.5 3h1.5m-7.5 3h7.5m-7.5 3h7.5m3-9h3.375c.621 0 1.125.504 1.125 1.125V18a2.25 2.25 0 01-2.25 2.25M16.5 7.5V18a2.25 2.25 0 002.25 2.25M16.5 7.5V4.875c0-.621-.504-1.125-1.125-1.125H4.125C3.504 3.75 3 4.254 3 4.875V18a2.25 2.25 0 002.25 2.25h13.5M6 7.5h3v3H6v-3z"/></svg>`, 
          label: 'Publications', 
          desc: 'Actualités & bulletins', 
          href: '/admin/publications.html', 
          soon: false 
        })
      }

      const EDITOR_PERMS = ['can_manage_commune','can_manage_vie_pratique','can_manage_urbanisme',
                            'can_manage_sivu','can_manage_vie_locale','can_manage_decouvrir']
      const hasEdit = admin || EDITOR_PERMS.some(k => profile[k])
      if (hasEdit) {
        items.push({ 
          icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>`, 
          label: 'Éditeur No-Code', 
          desc: 'Modifier le contenu du site', 
          href: '/admin/editor.html', 
          soon: false 
        })
      }

      if (admin) {
        items.push({ 
          icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>`, 
          label: 'Utilisateurs', 
          desc: 'Gérer les comptes', 
          href: '/admin/users.html' 
        })
        items.push({ 
          icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M7.25 12h5M7.25 15h5M7.25 18h3.25M15.75 18.75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25z"/></svg>`, 
          label: "Journal d'activité", 
          desc: 'Logs du panel', 
          href: '/admin/journal.html' 
        })
      }

      items.push({ 
        icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m.75 12 3 3m0 0 3-3m-3 3v-6m-1.5-9H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9Z"/></svg>`, 
        label: "Guide d'utilisation", 
        desc: 'Télécharger le manuel PDF', 
        href: "/assets/docs/Guide d'utilisation — Espace d'administration.pdf",
        soon: false,
        external: true
      })

      const grid = document.getElementById('quick-grid')

      if (items.length === 0) {
        grid.innerHTML = `<p class="text-muted text-sm" style="grid-column:1/-1">Aucun accès rapide disponible.</p>`
      } else {
        grid.innerHTML = items.map(item => `
          <a href="${item.soon ? '#' : item.href}"
             class="card quick-card ${item.soon ? 'disabled' : ''}"
             ${item.external ? 'target="_blank" rel="noopener noreferrer"' : ''}
             aria-label="${item.label}${item.soon ? ' — bientôt disponible' : ''}">
            <span class="quick-icon">${item.icon}</span>
            <div>
              <p class="quick-label">
                ${item.label}
                ${item.soon ? '<span class="text-sm text-muted" style="font-weight:400"> (bientôt)</span>' : ''}
              </p>
              <p class="quick-desc">${item.desc}</p>
            </div>
          </a>
        `).join('')
      }
    }

    init()
  </script>

</body>
</html>
