    /* ════════════════════════════════════════════════════════
       SECTIONS CONFIG (ordre navbar)

        {key:'dechets_data',         label:'Collecte des déchets'},
        {key:'etat_civil_data',      label:'État Civil'},
        {key:'salle_polyvalente_data',label:'Salle Polyvalente'},
        {key:'transports_lignes_data',label:'Transports en commun'},
        {key:'vie_quotidienne_data',  label:'Numéros utiles'},

      { label:'Urbanisme', perm:'can_manage_urbanisme', pages:[

        {key:'inscriptions_data',      label:'Inscriptions'},
        {key:'transports_etudes_data', label:'Transports & Études'},

    const PAGE_LABELS = {}
    SECTIONS.forEach(s => s.pages.forEach(p => PAGE_LABELS[p.key] = p.label))

    /* ── State ── */
    let profile      = null
    let currentKey   = null
    let currentData  = null
    let allContent   = {}
    let rteInstance  = null
    let isDirty = false

    window.addEventListener('beforeunload', (e) => {
    if (isDirty) {
        e.preventDefault()
        e.returnValue = ''
    }
    })

    /* ════════════════════════════════════════════════════════
       HELPERS
    ════════════════════════════════════════════════════════ */
    const escH    = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    const escAttr = s => s == null ? '' : String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')
    const fVal    = id => document.getElementById(id)?.value  ?? ''
    const fNum    = id => parseFloat(document.getElementById(id)?.value) || 0
    const fHTML   = id => document.getElementById(id)?.innerHTML ?? ''
    const fChk    = id => document.getElementById(id)?.checked  ?? false

    const fld = (id, label, val='', opts={}) => `
      <div class="form-group" style="${opts.style||''}">
        <label class="form-label">${label}</label>
        <input type="${opts.type||'text'}" id="${id}" class="form-input" value="${escAttr(val)}"
          placeholder="${escAttr(opts.ph||'')}" ${opts.readonly?'readonly style="opacity:.55;background:var(--creme)"':''}>
        ${opts.hint?`<p class="form-hint">${opts.hint}</p>`:''}
      </div>`

    const ta = (id, label, val='', opts={}) => `
      <div class="form-group" style="${opts.style||''}">
        <label class="form-label">${label}</label>
        <textarea id="${id}" class="form-input" rows="${opts.rows||2}" style="min-height:${opts.h||60}px">${escH(val)}</textarea>
        ${opts.hint?`<p class="form-hint">${opts.hint}</p>`:''}
      </div>`

    const numFld = (id, label, val, suffix='') => `
      <div class="form-group">
        <label class="form-label">${label}</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input type="number" id="${id}" class="form-input" value="${escAttr(val)}" style="max-width:130px">
          ${suffix?`<span class="text-sm text-muted">${suffix}</span>`:''}
        </div>
      </div>`

    const edHd = t => `<p class="ed-hd">${t}</p>`

    const toggleRow = (id, label, checked, sub='') => `
      <div class="permission-row">
        <div>
          <span class="permission-label">${label}</span>
          ${sub?`<p class="text-sm text-muted">${sub}</p>`:''}
        </div>
        <label class="toggle"><input type="checkbox" id="${id}" ${checked?'checked':''}><span class="toggle-slider"></span></label>
      </div>`

    /* ── List item HTML ── */
    const fieldInItem = (f, data) => {
      const v = data?.[f.key] ?? f.default ?? ''
      if (f.type === 'checkbox') return `
        <div class="fi-inline">
          <label class="toggle"><input type="checkbox" data-field="${f.key}" ${v?'checked':''}><span class="toggle-slider"></span></label>
          <label class="form-label">${f.label}</label>
        </div>`
      if (f.type === 'select') return `
        <div class="fi-g">
          <label class="form-label">${f.label}</label>
          <select data-field="${f.key}" class="form-select">
            ${(f.opts||[]).map(o=>`<option value="${o.v}" ${v===o.v?'selected':''}>${o.l}</option>`).join('')}
          </select>
        </div>`
      if (f.type === 'textarea') return `
        <div class="fi-g">
          <label class="form-label">${f.label}</label>
          <textarea data-field="${f.key}" class="form-input" rows="${f.rows||2}">${escH(v)}</textarea>
        </div>`
      return `
        <div class="fi-g">
          <label class="form-label">${f.label}</label>
          <input type="${f.type||'text'}" data-field="${f.key}" class="form-input" value="${escAttr(String(v))}">
        </div>`
    }

    const itemHTML = (fields, data={}) => `
      <div class="list-item">
        <div class="list-item-fields">${fields.map(f=>fieldInItem(f,data)).join('')}</div>
        <div class="list-item-btns">
          <button type="button" class="li-btn li-up" title="Monter">↑</button>
          <button type="button" class="li-btn li-down" title="Descendre">↓</button>
          <button type="button" class="li-btn li-del" title="Supprimer">×</button>
        </div>
      </div>`

    const listHTML = (id, items, fields, addLabel='Ajouter') => `
      <div class="list-editor" id="${id}">${(items||[]).map(item=>itemHTML(fields,item)).join('')}</div>
      <button type="button" class="btn btn-secondary btn-sm" id="${id}-add" style="margin-top:12px">+ ${addLabel}</button>`

    /* ── List management ── */
    function initListEditor(id, fields, defaultData={}) {
      const c   = document.getElementById(id)
      const btn = document.getElementById(id+'-add')
      if (!c) return

      const attach = item => {
        item.querySelector('.li-up')?.addEventListener('click', () => {
          const p = item.previousElementSibling
          if (p?.classList.contains('list-item')) c.insertBefore(item, p)
        })
        item.querySelector('.li-down')?.addEventListener('click', () => {
          const n = item.nextElementSibling
          if (n?.classList.contains('list-item')) c.insertBefore(n, item)
        })
        item.querySelector('.li-del')?.addEventListener('click', () => item.remove())
      }

      c.querySelectorAll('.list-item').forEach(attach)
      btn?.addEventListener('click', () => {
        const div = document.createElement('div')
        div.innerHTML = itemHTML(fields, defaultData)
        const ni = div.firstElementChild
        c.appendChild(ni)
        attach(ni)
      })
    }

    function collectList(id, fields) {
      return [...document.querySelectorAll(`#${id} .list-item`)].map(item => {
        const obj = {}
        fields.forEach(f => {
          const el = item.querySelector(`[data-field="${f.key}"]`)
          if (!el) return
          obj[f.key] = f.type === 'checkbox' ? el.checked
                     : f.type === 'number'   ? (parseFloat(el.value)||0)
                     : el.value
        })
        return obj
      })
    }

    /* ════════════════════════════════════════════════════════
    MINI RTE (Mot du Maire uniquement — Version Corrigée)
    ════════════════════════════════════════════════════════ */
    class MiniRTE {
    constructor(id) {
        this.wrap = document.getElementById(id)
        if (!this.wrap) return
        
        this.wrap.innerHTML = `
        <div class="rte-toolbar">
            <button type="button" class="rte-btn" data-cmd="bold" title="Gras"><b>G</b></button>
            <button type="button" class="rte-btn" data-cmd="italic" title="Italique"><em>I</em></button>
            <span class="rte-sep"></span>
            <button type="button" class="rte-btn" data-cmd="highlight" title="Encadré lettre-highlight">✦ Encadré</button>
        </div>
        <div class="rte-content" contenteditable="true" spellcheck="true"></div>`
        
        const toolbar  = this.wrap.querySelector('.rte-toolbar')
        this.editor    = this.wrap.querySelector('.rte-content')
        
        toolbar.addEventListener('mousedown', e => e.preventDefault())
        toolbar.addEventListener('click', e => {
        const btn = e.target.closest('[data-cmd]'); if (!btn) return
        e.preventDefault(); this._exec(btn.dataset.cmd)
        })

        this.editor.addEventListener('keyup',   () => this._updateState(toolbar))
        this.editor.addEventListener('mouseup', () => this._updateState(toolbar))
    }

    _exec(cmd) {
        this.editor.focus()
        
        if (cmd === 'highlight') {
        const sel = window.getSelection()
        if (!sel.rangeCount) return

        let node = sel.getRangeAt(0).commonAncestorContainer
        if (node.nodeType === Node.TEXT_NODE) node = node.parentNode
        
        const existingHighlight = node.closest('.lettre-highlight')

        if (existingHighlight) {
            const parent = existingHighlight.parentNode
            while (existingHighlight.firstChild) {
            parent.insertBefore(existingHighlight.firstChild, existingHighlight)
            }
            parent.removeChild(existingHighlight)
        } else {
            let targetBlock = node
            while (targetBlock && targetBlock.parentNode !== this.editor && targetBlock !== this.editor) {
            targetBlock = targetBlock.parentNode
            }

            if (targetBlock && targetBlock !== this.editor) {
            const div = document.createElement('div')
            div.className = 'lettre-highlight'
            
            targetBlock.parentNode.insertBefore(div, targetBlock)
            div.appendChild(targetBlock)
            } else {
            const div = document.createElement('div')
            div.className = 'lettre-highlight'
            div.innerHTML = `<p>${this.editor.innerHTML || '<br>'}</p>`
            this.editor.innerHTML = ''
            this.editor.appendChild(div)
            }
            
            sel.removeAllRanges()
        }
        } else {
        document.execCommand(cmd, false, null)
        }
        
        this._updateState(this.wrap.querySelector('.rte-toolbar'))
    }

    _updateState(toolbar) {
        const sel = window.getSelection()
        let parentNode = null
        if (sel.rangeCount > 0) {
        parentNode = sel.getRangeAt(0).commonAncestorContainer
        if (parentNode.nodeType === Node.TEXT_NODE) parentNode = parentNode.parentNode
        }

        toolbar.querySelectorAll('[data-cmd]').forEach(btn => {
        const cmd = btn.dataset.cmd
        try {
            if (cmd === 'highlight') {
            const isActive = parentNode ? !!parentNode.closest('.lettre-highlight') : false
            btn.classList.toggle('active', isActive)
            } else {
            btn.classList.toggle('active', document.queryCommandState(cmd))
            }
        } catch {}
        })
    }

    getValue() { return this.editor?.innerHTML || '' }
    setValue(html) { if (this.editor) this.editor.innerHTML = html || '' }
    }

    /* ════════════════════════════════════════════════════════
       FIELD DEFINITIONS (shared)
    ════════════════════════════════════════════════════════ */
    const DOC_FIELDS  = [
      {key:'title',    label:'Titre',      type:'text'},
      {key:'subtitle', label:'Sous-titre', type:'text'},
      {key:'url',      label:'Lien (URL)', type:'url'},
    ]
    const VQ_FIELDS   = [
      {key:'name',         label:'Nom / Service', type:'text'},
      {key:'number',       label:'Numéro',        type:'text'},
      {key:'is_emergency', label:'Urgence',        type:'checkbox'},
    ]
    const ROLE_FIELDS = [
      {key:'role',  label:'Rôle',  type:'text'},
      {key:'names', label:'Noms (séparés par virgules)', type:'text'},
    ]
    const LINK_FIELDS = [
      {key:'label', label:'Libellé', type:'text'},
      {key:'url',   label:'URL',     type:'url'},
      {key:'type',  label:'Type', type:'select', opts:[
        {v:'sp-link',l:'Service-public'},{v:'outil-en-ligne',l:'Outil en ligne'},{v:'telecharger',l:'Télécharger'},
      ]},
    ]
    const ARRET_FIELDS= [{key:'heure',label:'Heure',type:'text'},{key:'arret',label:'Arrêt',type:'text'}]
    const COMM_KEYS   = ['cao','pnr','ccas','cdid','plui','clect','sdesm','cimetiere','elections','urbanisme','festivites','gendarmerie','petit_morin','sivu_ecoles']
    const COMM_LABELS = {
      cao:'Commission d\'Appel d\'Offres',pnr:'Parc Naturel Régional',ccas:'CCAS',
      cdid:'Comm. Dép. Impôts Directs',plui:'PLUi',clect:'CLECT',sdesm:'SDESM',
      cimetiere:'Commission Cimetière',elections:'Commission Élections',
      urbanisme:'Commission Urbanisme',festivites:'Commission Festivités',
      gendarmerie:'Gendarmerie',petit_morin:'Syndicat du Petit Morin',sivu_ecoles:'SIVU Écoles',
    }
    const PERM_LINK_CARDS = {
      fiscalite:'Fiscalité & Taxe d\'aménagement',
      transfert:'Transfert de permis',
      certificat:'Certificat d\'urbanisme',
      construire:'Permis de construire',
      declaration:'Déclaration préalable',
      modificatif:'Permis modificatif',
      contestation:'Recours & Contestation',
    }
    const PERM_LINK_TYPES = [
      {v:'service-public',l:'Service-public'},{v:'outil-en-ligne',l:'Outil en ligne'},{v:'telecharger',l:'Télécharger'},
    ]
    const PDAYS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche']
    const EC_SECTION_LABELS = {
      cni:'Carte d\'Identité & Passeport',recensement:'Recensement militaire',
      'sortie-territoire':'Sortie du territoire',mariage:'Mariage & PACS',
      parrainage:'Parrainage civil',
      'listes-electorales':'Listes électorales',

    }

    /* ════════════════════════════════════════════════════════
       RENDER FUNCTIONS
    ════════════════════════════════════════════════════════ */

    /* ── 1. Mot du Maire ── */
    function renderMotDuMaire(d) {
      return `
        ${edHd('Extrait (page d\'accueil)')}
        ${ta('mdm-extrait','Texte court affiché sur la page d\'accueil',d.extrait||'',{rows:3})}
        ${edHd('Mot complet')}
        <p class="form-hint" style="margin-bottom:8px">Utilisez <b>G</b> pour le gras et ✦ Encadré pour les blocs mis en valeur.</p>
        <div class="rte-wrap" id="mdm-rte"></div>`
    }
    function serializeMotDuMaire() {
      return { extrait: fVal('mdm-extrait'), complet: rteInstance?.getValue() || fHTML('mdm-rte') }
    }

    /* ── 2. Commissions ── */
    function renderCommissions(d) {
      return COMM_KEYS.map(key => {
        const c = d[key] || {type:'roles',content:[]}
        const isR = c.type === 'roles'
        const rolesHTML = isR ? (c.content||[]).map(r => itemHTML(ROLE_FIELDS,r)).join('') : ''
        const txtVal    = !isR ? (typeof c.content === 'string' ? c.content : '') : ''
        return `
          <div style="margin-bottom:12px;border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);overflow:hidden">
            <div style="display:flex;align-items:center;justify-content:space-between;padding:9px 13px;background:var(--creme)">
              <span style="font-size:13px;font-weight:600">${COMM_LABELS[key]}</span>
              <select class="form-select" data-comm-type="${key}" style="width:auto;padding:4px 28px 4px 9px;font-size:12px">
                <option value="roles" ${isR?'selected':''}>Rôles</option>
                <option value="text"  ${!isR?'selected':''}>Texte libre</option>
              </select>
            </div>
            <div style="padding:10px">
              <div data-comm-roles="${key}" ${!isR?'style="display:none"':''}>
                <div class="list-editor" id="comm-${key}">${rolesHTML}</div>
                <button type="button" class="btn btn-secondary btn-sm" id="comm-${key}-add" style="margin-top:12px">+ Ajouter un rôle</button>
              </div>
              <div data-comm-text="${key}" ${isR?'style="display:none"':''}>
                <textarea class="form-input" id="comm-text-${key}" rows="3">${escH(txtVal)}</textarea>
              </div>
            </div>
          </div>`
      }).join('')
    }
    function serializeCommissions() {
      const res = {}
      COMM_KEYS.forEach(key => {
        const type = document.querySelector(`[data-comm-type="${key}"]`)?.value || 'roles'
        res[key] = type === 'roles'
          ? {type:'roles', content: collectList(`comm-${key}`, ROLE_FIELDS)}
          : {type:'text',  content: fVal(`comm-text-${key}`)}
      })
      return res
    }

    /* ── 3. Permanences ── */
    const PERM_SECTIONS = [{key:'mairie',label:'Mairie'},{key:'secretariat',label:'Secrétariat'},{key:'urbanisme',label:'Urbanisme'},{key:'ccas',label:'CCAS'}]
    function renderPermanences(d) {
      return PERM_SECTIONS.map(s => {
        const sec = d[s.key] || {note:null,rows:[]}
        const rowMap = {}
        ;(sec.rows||[]).forEach(r => rowMap[r.day] = r)
        return `
          ${edHd(s.label)}
          ${fld(`perm-${s.key}-note`,'Note (optionnelle)', sec.note||'', {ph:'Ex: Également sur rendez-vous'})}
          <div class="perm-table">
            ${PDAYS.map(day => {
              const row = rowMap[day] || {day,hours:'',details:'',closed:false}
              const cl  = !!row.closed
              return `
                <div class="perm-row" data-ps="${s.key}" data-pd="${day}">
                  <span class="perm-day">${day}</span>
                  <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                    <input type="text" class="form-input perm-hours" value="${escAttr(row.hours||'')}"
                      placeholder="09:00–12:30" ${cl?'style="opacity:.4;pointer-events:none"':''}>
                    <input type="text" class="form-input perm-details" value="${escAttr(row.details||'')}"
                      placeholder="Précision (ex: semaines paires)" style="font-size: 0.8rem; height: 28px; ${cl?'opacity:.4;pointer-events:none':''}">
                  </div>
                  <label class="toggle" title="Fermé">
                    <input type="checkbox" class="perm-closed" ${cl?'checked':''}>
                    <span class="toggle-slider"></span>
                  </label>
                </div>`
            }).join('')}
          </div>`
      }).join('')
    }
    function serializePermanences() {
      const res = {}
      PERM_SECTIONS.forEach(s => {
        const note = fVal(`perm-${s.key}-note`).trim() || null
        const rows = PDAYS.map(day => {
          const row    = document.querySelector(`[data-ps="${s.key}"][data-pd="${day}"]`)
          const closed = row?.querySelector('.perm-closed')?.checked || false
          const hours  = row?.querySelector('.perm-hours')?.value || ''
          const details = row?.querySelector('.perm-details')?.value || ''
          return {day, hours: closed ? 'Fermé' : hours, details: closed ? '' : details, closed}
        })
        res[s.key] = {note, rows}
      })
      return res
    }

    /* ── 4. Cantine ── */
    const MENU_FIELDS = [{key:'title',label:'Titre',type:'text'},{key:'url',label:'URL du PDF',type:'url'}]
    function renderCantine(d) {
      const tarifs = d.tarifs || {}
      const items  = tarifs.items || []

    function serializeEtatCivil() {
      const order = [...document.querySelectorAll('#ec-order .list-item')].map(el => el.dataset.section)
      const sections = {}
      const origSections = currentData?.sections || {}
      order.forEach(key => {
        const sec = {...(origSections[key]||{})}
        sec.paragraphs = [...document.querySelectorAll(`#ec-paras-${key} .para-item`)].map(el => el.innerHTML)
        const hasPieces = ['recensement','parrainage','listes-electorales','procuration','attestation-accueil'].includes(key)
        if (hasPieces) sec.pieces = [...document.querySelectorAll(`#ec-pieces-${key} .list-item`)].map(el => el.querySelector('[data-field="val"]')?.value || '')
        const hasNote = ['mariage','sortie-territoire','listes-electorales','procuration'].includes(key)
        if (hasNote) sec.note = {text: fVal(`ec-note-text-${key}`), is_alert: fChk(`ec-note-alert-${key}`)}
        if (key === 'cni') sec.biometrie = fVal('ec-bio-cni')
        if (key === 'mariage') {
          sec.main_btn   = {url: fVal('ec-main-btn-url-mariage'), label: fVal('ec-main-btn-label-mariage')}
          sec.pacs_links = (origSections.mariage?.pacs_links||[]).map((l,i)=>({...l, url:fVal(`ec-pacs-${i}`)}))
        }
        const hasLinks = key !== 'recensement' && key !== 'attestation-accueil' && key !== 'mariage'
        if (hasLinks) sec.links = collectList(`ec-links-${key}`, LINK_FIELDS)
        sections[key] = sec
      })
      return {update_date: fVal('ec-update-date'), sections_order: order, sections}

    /* ════════════════════════════════════════════════════════
       DISPATCH
    ════════════════════════════════════════════════════════ */
    const RENDERERS = {
      mot_du_maire:              renderMotDuMaire,
      commissions_data:          renderCommissions,
      permanences_data:          renderPermanences,
      cantine_data:              renderCantine,
      dechets_data:              renderDechets,
      eau_assainissement_data:   renderEauAssainissement,
      etat_civil_data:           renderEtatCivil,
      inscriptions_data:         renderInscriptions,
      permis_travaux_data:       renderPermisTravaux,

      salle_polyvalente_data:    renderSallePolyvalente,
      scolarite_periscolaire_data: renderScolarite,
      sivu_infos_data:           renderSivuInfos,
      sivu_practical_data:       renderSivuPractical,

      transports_lignes_data:    renderTransportsLignes,

    const SERIALIZERS = {
      mot_du_maire:              serializeMotDuMaire,
      commissions_data:          serializeCommissions,
      permanences_data:          serializePermanences,
      cantine_data:              serializeCantine,
      dechets_data:              serializeDechets,
      eau_assainissement_data:   serializeEauAssainissement,
      etat_civil_data:           serializeEtatCivil,
      inscriptions_data:         serializeInscriptions,
      permis_travaux_data:       serializePermisTravaux,
      plu_data:                  serializePlu,
      salle_polyvalente_data:    serializeSallePolyvalente,
      scolarite_periscolaire_data: serializeScolarite,
      sivu_infos_data:           serializeSivuInfos,
      sivu_practical_data:       serializeSivuPractical,
      transports_etudes_data:    serializeTransportsEtudes,
      transports_lignes_data:    serializeTransportsLignes,
      vie_quotidienne_data:      serializeVieQuotidienne,

    /* ════════════════════════════════════════════════════════
       INIT COMPORTEMENTS DYNAMIQUES POST-RENDER
    ════════════════════════════════════════════════════════ */
    function initEditorBehavior(key, data) {
      switch(key) {
        case 'mot_du_maire':
          rteInstance = new MiniRTE('mdm-rte')
          rteInstance.setValue(data.complet || '')
          break

        case 'commissions_data':
          COMM_KEYS.forEach(k => {
            document.querySelector(`[data-comm-type="${k}"]`)?.addEventListener('change', e => {
              document.querySelector(`[data-comm-roles="${k}"]`).style.display = e.target.value==='roles'?'':'none'
              document.querySelector(`[data-comm-text="${k}"]`).style.display  = e.target.value==='text' ?'':'none'
            })
            initListEditor(`comm-${k}`, ROLE_FIELDS)
          })
          break

        case 'permanences_data':
          document.querySelectorAll('.perm-closed').forEach(chk => {
            chk.addEventListener('change', () => {
              const row    = chk.closest('.perm-row')
              const inp    = row.querySelector('.perm-hours')
              if (chk.checked) { inp.value='Fermé'; inp.style.opacity='.4'; inp.style.pointerEvents='none' }
              else { if(inp.value==='Fermé')inp.value=''; inp.style.opacity=''; inp.style.pointerEvents=''; }
            })
          })
          break

        case 'cantine_data':
          initListEditor('cantine-menus', MENU_FIELDS)
          break

        case 'dechets_data':
          initListEditor('dechet-orgs', ORG_FIELDS)
          break

        case 'etat_civil_data': {
          // Order list
          const orderC = document.getElementById('ec-order')
          const attachO = item => {
            item.querySelector('.li-up')?.addEventListener('click', () => {
              const p = item.previousElementSibling
              if (p?.classList.contains('list-item')) orderC.insertBefore(item, p)
            })
            item.querySelector('.li-down')?.addEventListener('click', () => {
              const n = item.nextElementSibling
              if (n?.classList.contains('list-item')) orderC.insertBefore(n, item)
            })
          }
          orderC?.querySelectorAll('.list-item').forEach(attachO)
          // Per-section inits
          const order = data.sections_order || Object.keys(data.sections||{})
          order.forEach(key => {
            const sec = data.sections?.[key] || {}
            const hasPieces=['recensement','parrainage','listes-electorales','procuration','attestation-accueil'].includes(key)
            if (hasPieces) {
              const pc = document.getElementById(`ec-pieces-${key}`)
              const pa = document.getElementById(`ec-pieces-${key}-add`)
              const attachP = item => {
                item.querySelector('.li-up')?.addEventListener('click',()=>{const p=item.previousElementSibling;if(p?.classList.contains('list-item'))pc.insertBefore(item,p)})
                item.querySelector('.li-down')?.addEventListener('click',()=>{const n=item.nextElementSibling;if(n?.classList.contains('list-item'))pc.insertBefore(n,item)})
                item.querySelector('.li-del')?.addEventListener('click',()=>item.remove())
              }
              pc?.querySelectorAll('.list-item').forEach(attachP)
              pa?.addEventListener('click',()=>{const d=document.createElement('div');d.innerHTML=`<div class="list-item"><div class="list-item-fields"><input type="text" data-field="val" class="form-input" value="" style="font-size:13px;padding:5px 9px"></div><div class="list-item-btns"><button class="li-btn li-up">↑</button><button class="li-btn li-down">↓</button><button class="li-btn li-del">×</button></div></div>`;const ni=d.firstElementChild;pc.appendChild(ni);attachP(ni)})
            }
            const hasLinks = key!=='recensement'&&key!=='attestation-accueil'&&key!=='mariage'
            if (hasLinks) initListEditor(`ec-links-${key}`, LINK_FIELDS)
            // Para add button
            const paraC = document.getElementById(`ec-paras-${key}`)
            document.getElementById(`ec-para-add-${key}`)?.addEventListener('click', () => {
              const div = document.createElement('div')
              div.className = 'para-item'
              div.contentEditable = 'true'
              paraC?.appendChild(div)
              div.focus()
            })
          })
          break
        }

        case 'inscriptions_data':
          initListEditor('ins-etude',   DOC_FIELDS)
          initListEditor('ins-cantine', DOC_FIELDS)
          break

        case 'permis_travaux_data':
          Object.keys(PERM_LINK_CARDS).forEach(k => initListEditor(`pt-card-${k}`, PT_LINK_FIELDS))
          break

        case 'plu_data': {
          const g0 = (data.groups?.[0]?.sections||[])
          g0.forEach((_,si) => initListEditor(`plu-g0s${si}`, PLU_DOC_FIELDS))
          const g1 = (data.groups?.[1]?.sections||[])
          g1.forEach((_,si) => initListEditor(`plu-g1s${si}`, PLU_DOC_FIELDS))
          // Delete section
          document.querySelectorAll('[data-plu-g1-sec] .li-del').forEach(btn => {
            btn.addEventListener('click', () => btn.closest('[data-plu-g1-sec]').remove())
          })
          // Add section
          document.getElementById('plu-g1-add')?.addEventListener('click', () => {
            const idx = document.querySelectorAll('[data-plu-g1-sec]').length
            const div = document.createElement('div')
            div.setAttribute('data-plu-g1-sec','')
            div.className = 'plu-section-card'
            div.innerHTML = `
              <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <input type="text" data-plu-sec-label class="form-input" placeholder="Nom de la section" style="font-size:13px;padding:5px 9px">
                <button type="button" class="li-btn li-del">×</button>
              </div>
              <div class="list-editor" id="plu-g1s${idx}"></div>
              <button type="button" class="btn btn-secondary btn-sm" id="plu-g1s${idx}-add" style="margin-top:12px">+ Ajouter un document</button>`
            document.getElementById('plu-g1-sections').appendChild(div)
            div.querySelector('.li-del').addEventListener('click', () => div.remove())
            initListEditor(`plu-g1s${idx}`, PLU_DOC_FIELDS)
          })
          break
        }

        case 'scolarite_periscolaire_data':
          initListEditor('scol-tr-coul', SCOL_LIGNE_FIELDS)
          initListEditor('scol-tr-fert', SCOL_LIGNE_FIELDS)
          break

        case 'sivu_infos_data': {
          initListEditor('sivu-sc-tit', NOM_FIELDS)
          initListEditor('sivu-sc-sup', NOM_FIELDS)
          initListEditor('sivu-so-tit', NOM_FIELDS)
          initListEditor('sivu-so-sup', NOM_FIELDS)
          const SFIELDS=[{key:'category',label:'Catégorie',type:'text'},{key:'names_str',label:'Noms',type:'text'}]
          const ic = document.getElementById('sivu-interv')
          const ia = document.getElementById('sivu-interv-add')
          const attachI = item => {
            item.querySelector('.li-up')?.addEventListener('click',()=>{const p=item.previousElementSibling;if(p?.classList.contains('list-item'))ic.insertBefore(item,p)})
            item.querySelector('.li-down')?.addEventListener('click',()=>{const n=item.nextElementSibling;if(n?.classList.contains('list-item'))ic.insertBefore(n,item)})
            item.querySelector('.li-del')?.addEventListener('click',()=>item.remove())
          }
          ic?.querySelectorAll('.list-item').forEach(attachI)
          ia?.addEventListener('click',()=>{
            const d2=document.createElement('div')
            d2.innerHTML=`<div class="list-item"><div class="list-item-fields"><div class="fi-g"><label class="form-label">Catégorie</label><input type="text" data-field="category" class="form-input" value=""></div><div class="fi-g"><label class="form-label">Noms (séparés par virgules)</label><input type="text" data-field="names_str" class="form-input" value=""></div></div><div class="list-item-btns"><button class="li-btn li-up">↑</button><button class="li-btn li-down">↓</button><button class="li-btn li-del">×</button></div></div>`
            const ni=d2.firstElementChild; ic.appendChild(ni); attachI(ni)
          })
          break
        }

        case 'sivu_practical_data':
          initListEditor('sivup-docs', DOC_FIELDS)
          break

        case 'transports_etudes_data':
          initListEditor('te-docs', TE_DOC_FIELDS)
          ;[0,1,2].forEach(i => {
            initListEditor(`te-l${i}-matin`, ARRET_FIELDS)
            initListEditor(`te-l${i}-soir`,  ARRET_FIELDS)
          })
          break

        case 'transports_lignes_data':
          initListEditor('trl-lignes', TR_LIGNE_FIELDS)
          break

        case 'vie_quotidienne_data':
          initListEditor('vq-list', VQ_FIELDS)
          break
      }
    }

    /* ════════════════════════════════════════════════════════
       FRAMEWORK
    ════════════════════════════════════════════════════════ */
    async function loadAllContent() {
      const { data, error } = await supabase.from('site_content').select('key,value')
      if (error) {
        console.error('[Editor] Erreur site_content:', error)
        showToast('Impossible de charger le contenu. Vérifiez les RLS de site_content.', 'error')
        return
      }
      if (!data?.length) {
        console.warn('[Editor] site_content vide ou inaccessible pour cet utilisateur.')
        showToast('Aucun contenu trouvé. Vérifiez les politiques SELECT de site_content.', 'info')
        return
      }
      data.forEach(row => {
        try {
          /* Supabase retourne jsonb comme objet JS déjà parsé, text comme string */
          allContent[row.key] = typeof row.value === 'string' ? JSON.parse(row.value) : row.value
        } catch(e) {
          console.error('[Editor] Parse error pour la clé:', row.key, e)
        }
      })
      console.log('[Editor] Clés chargées:', Object.keys(allContent))
    }

    function openEditor(key) {
      if (isDirty) {
        const confirmLeave = confirm("Attention : Vous avez des modifications non enregistrées. Voulez-vous vraiment changer de page et perdre vos modifications ?")
        if (!confirmLeave) {
          return
        }
      }
      
      isDirty = false

      currentKey  = key
      currentData = allContent[key]
      rteInstance = null

      if (!currentData) {
        showToast('Contenu introuvable pour cette clé.', 'error')
        return
      }

      const renderer = RENDERERS[key]
      if (!renderer) {
        document.getElementById('editor-form-body').innerHTML = `<p class="text-muted text-sm">Éditeur non disponible pour "${key}".</p>`
        return
      }

      document.getElementById('editor-form-body').innerHTML   = renderer(currentData)
      document.getElementById('editor-form-title').textContent = PAGE_LABELS[key] || key
      document.getElementById('editor-save-status').textContent = ''
      document.getElementById('editor-empty').style.display   = 'none'
      document.getElementById('editor-form-wrap').style.display = 'block'
      document.getElementById('btn-save').disabled = false

      document.querySelectorAll('.cn-item').forEach(i => i.classList.toggle('active', i.dataset.key === key))

      requestAnimationFrame(() => initEditorBehavior(key, currentData))
    }

    async function save() {
      if (!currentKey) return
      const serializer = SERIALIZERS[currentKey]
      if (!serializer) { showToast('Serializer manquant.', 'error'); return }

      const btn    = document.getElementById('btn-save')
      const status = document.getElementById('editor-save-status')
      btn.disabled    = true
      btn.textContent = 'Enregistrement…'

      let newData
      try { newData = serializer() }
      catch(e) { showToast('Erreur de lecture du formulaire : ' + e.message, 'error'); btn.disabled=false; btn.textContent='Enregistrer'; return }

      /* La colonne value est jsonb — Supabase sérialise lui-même.
         Ne pas passer JSON.stringify() sinon double-encodage. */
      const { error } = await supabase
        .from('site_content')
        .update({ value: newData })
        .eq('key', currentKey)

      btn.disabled    = false
      btn.textContent = 'Enregistrer'

      if (error) { showToast('Erreur : ' + error.message, 'error'); return }

      allContent[currentKey] = newData
      currentData = newData
      status.textContent = 'Enregistré ✓'
      setTimeout(() => { status.textContent = '' }, 3000)
      showToast('Contenu enregistré.')
      
      // ─── RÉINITIALISATION DU FLAG APRÈS SAUVEGARDE RÉUSSIE ───
      isDirty = false 
    }

    /* ── Navigation ── */
    function buildNav(profile) {
      const admin = isAdmin(profile)
      const inner = document.getElementById('cn-inner')
      inner.innerHTML = ''
      let firstSec = true

      SECTIONS.forEach(sec => {
        const hasAccess = admin || !!profile[sec.perm]
        if (!hasAccess) return

        const hd = document.createElement('p')
        hd.className = firstSec ? 'cn-section' : 'cn-section sep'
        hd.textContent = sec.label
        inner.appendChild(hd)
        firstSec = false

        sec.pages.forEach(page => {
          const btn = document.createElement('button')
          btn.className   = 'cn-item'
          btn.textContent = page.label
          btn.dataset.key = page.key
          btn.addEventListener('click', () => openEditor(page.key))
          inner.appendChild(btn)
        })
      })
    }

    /* ════════════════════════════════════════════════════════
       INIT
    ════════════════════════════════════════════════════════ */
    async function init() {
      const auth = await requireAuth()
      if (!auth) return

      profile = auth.profile

      const hasAnyEdit = isAdmin(profile) || Object.keys(PERMISSIONS).some(k => profile[k])
      if (!hasAnyEdit) { window.location.replace('/admin/dashboard.html'); return }

      document.getElementById('page-loader').style.display     = 'none'
      document.getElementById('admin-layout').style.visibility = 'visible'

      buildSidebar(profile, 'editor')
      buildNav(profile)

      document.getElementById('btn-save').addEventListener('click', save)

      await loadAllContent()
    }

    // ─── CAPTURE DES MODIFICATIONS GLOBALISÉE ───
    const formWrap = document.getElementById('editor-form-wrap')
    if (formWrap) {
        formWrap.addEventListener('input', () => { isDirty = true })
        formWrap.addEventListener('change', () => { isDirty = true })

        formWrap.addEventListener('click', (e) => {
            if (e.target.closest('.li-btn') || e.target.closest('[id$="-add"]')) {
            isDirty = true
            }
        })
    }

    init()
  </script>
