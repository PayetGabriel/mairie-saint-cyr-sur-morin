<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <title>Connexion Espace Collaborateur — Saint-Cyr-sur-Morin</title>
  <meta name="description" content="Espace de connexion réservé aux employés municipaux et administrateurs de la mairie de Saint-Cyr-sur-Morin." />
  <meta name="author" content="Gabriel PAYET" />

  <!-- Sécurité maximale : Aucun référencement, aucun cache public -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff">

  <!-- Open Graph (Gabarit conservé) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Connexion Espace Collaborateur — Saint-Cyr-sur-Morin" />
  <meta property="og:description" content="Accès sécurisé à l'administration du site municipal." />
  <meta property="og:image" content="https://mairie-saint-cyr-sur-morin.vercel.app/assets/img/logoSaintCyr_2020_web.png" />
  <meta property="og:image:width" content="984" />
  <meta property="og:image:height" content="1200" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/assets/img/logoSaintCyr_2020-favicon.png">
  <link rel="apple-touch-icon" href="/assets/img/logoSaintCyr_2020-favicon.png">
  
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="auth-page">

  <div class="auth-card">

    <div class="auth-header">
      <img src="/assets/img/logoSaintCyr_2020.svg" alt="Blason Saint-Cyr-sur-Morin">
      <div class="auth-header-text">
        <strong>Saint-Cyr-sur-Morin</strong>
        <span>Mairie — 77750</span>
      </div>
    </div>

    <div class="auth-body">
      <h1 class="auth-title">Connexion</h1>
      <p class="auth-subtitle">Accès réservé au personnel autorisé.</p>

      <div id="alert" class="alert alert-error" style="display:none" role="alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Adresse email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="prenom.nom@mairie.fr"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">
            Mot de passe
            <a href="/admin/reset-password.html" class="auth-link">Mot de passe oublié ?</a>
          </label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-input"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button
          type="submit"
          class="btn btn-primary"
          id="submit-btn"
          style="width:100%;justify-content:center;margin-top:6px"
        >
          Se connecter
        </button>
      </form>
    </div>

  </div>

  <script type="module">
    import { supabase } from '/admin/js/supabase-config.js'

    const form      = document.getElementById('login-form')
    const alertEl   = document.getElementById('alert')
    const submitBtn = document.getElementById('submit-btn')

    // 1. Éviter le "flash" visuel le temps de vérifier la session
    document.body.style.opacity = '0'

    /* Vérification de la session active */
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (session) {
        // Déjà connecté -> redirection immédiate
        window.location.replace('/admin/dashboard.html')
      } else {
        // Non connecté -> apparition en douceur du formulaire
        document.body.style.transition = 'opacity 0.2s ease-in-out'
        document.body.style.opacity = '1'
      }
    })

    // Dictionnaire de traduction des erreurs de Supabase Auth
    const ERROR_MESSAGES = {
      'Invalid login credentials': 'Identifiants incorrects. Vérifiez votre email et mot de passe.',
      'Email not confirmed':        "Votre compte n'est pas encore confirmé. Vérifiez vos emails.",
      'Too many requests':          'Trop de tentatives. Réessayez dans quelques minutes.',
    }

    function showError(msg) {
      alertEl.textContent = msg
      alertEl.style.display = 'flex'
    }

    /* Gestion de la soumission du formulaire */
    form.addEventListener('submit', async e => {
      e.preventDefault()
      alertEl.style.display = 'none'

      const email    = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      if (!email || !password) {
        showError('Veuillez remplir tous les champs.')
        return
      }

      // Feedback visuel de chargement
      submitBtn.disabled    = true
      submitBtn.textContent = 'Connexion…'

      // Tentative de connexion via Supabase Auth
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })

      if (error) {
        showError(ERROR_MESSAGES[error.message] || 'Une erreur est survenue. Réessayez.')
        submitBtn.disabled    = false
        submitBtn.textContent = 'Se connecter'
        return
      }

      /* OPTIMISATION : Une seule requête pour valider le profil + préparer les logs */
      const { data: profile, error: profileErr } = await supabase
        .from('profiles')
        .select('id, role, prenom, nom, email')
        .eq('id', data.user.id)
        .single()

      // Si le compte n'a pas de profil correspondant en base (compte suspendu / non activé)
      if (profileErr || !profile) {
        await supabase.auth.signOut()
        showError("Votre compte n'est pas encore activé. Contactez un administrateur.")
        submitBtn.disabled    = false
        submitBtn.textContent = 'Se connecter'
        return
      }

      // Écriture du log d'activité (non bloquant : si ça échoue, on redirige quand même)
      try {
        const displayName = [profile.prenom, profile.nom].filter(Boolean).join(' ') || profile.email
        
        await supabase.from('activity_logs').insert({
          user_id:    data.user.id,
          user_email: profile.email || data.user.email,
          user_name:  displayName,
          action:     'SIGNIN',
        })
      } catch (logErr) {
        console.warn("Impossible d'enregistrer le log de connexion :", logErr)
      }

      // Redirection finale vers l'espace collaborateur
      window.location.replace('/admin/dashboard.html')
    })
  </script>

</body>
</html>
